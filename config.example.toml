# Configuração do "ideias" (gerador de ideias).
#
# Copie este arquivo para um destes lugares (o primeiro que existir vence):
#   1. ./config.toml                    (pasta onde o comando roda)
#   2. ~/.config/ideias/config.toml
# Ou aponte outro caminho com `ideias --config caminho.toml <comando>`.
#
# Tudo aqui pode ser editado sem recompilar. Segredos (tokens, senhas, chaves)
# NÃO ficam neste arquivo: vão em variáveis de ambiente ou em ~/.config/ideias/env
# (veja env.example).
#
# Se nenhum config.toml for encontrado, o binário usa os valores deste arquivo,
# que vem embutido nele.

# Caminho do banco SQLite. "~" é expandido para a pasta do usuário.
db_path = "~/.local/share/ideias/ideias.db"

# Idiomas detectados e coletados (códigos ISO 639-1).
# Suportados na v1: en, pt, es, de, fr.
languages = ["en", "pt", "es", "de", "fr"]

# ---------------------------------------------------------------------------
# Frases de dor e de pedido
# ---------------------------------------------------------------------------
# pain_score de um item = soma dos pesos das frases casadas (cada frase conta
#                         uma vez) + brand_bonus (se citar marca)
#                         + bônus de engajamento.
# O item vira CANDIDATO (e só então guarda o texto) se a soma das frases mais o
# brand_bonus chegar a min_score; o engajamento só ordena os candidatos.
# Os tipos são livres, mas cada tipo usado em [pain.phrases.*] precisa de um
# peso em [pain.weights]. As frases são comparadas por palavra inteira, sem
# diferenciar maiúsculas nem acentos, e valem em qualquer idioma do texto.
[pain]
min_score = 1.0
brand_bonus = 0.5
# Tipos de frase que só contam se o item citar alguma marca. "alternative to
# the system" ou "this sucks" sem marca são discussão abstrata, não dor de produto.
brand_required = ["alternative", "complaint"]
# Bônus máximo por engajamento (pontos, likes, reações), em escala logarítmica:
# o máximo é atingido com ~100 de engajamento.
engagement_bonus_max = 2.0

[pain.weights]
request     = 1.0  # pede uma ferramenta ("is there an app")
alternative = 1.5  # procura substituto ("alternative to")
payment     = 2.0  # sinal de pagamento ("I'd pay for")
complaint   = 0.8  # reclamação ("why doesn't", "so frustrating")
churn       = 1.8  # largou um produto ("cancelled my subscription")
# Sinal de distribuição automática (design, seção 6): intenção de busca ou de
# marketplace. Indica que o público procuraria e acharia o produto sozinho.
distribution = 1.2

[pain.phrases.en]
request     = ["is there an app", "is there a tool", "i wish there was", "does anyone know a tool", "looking for a tool", "feature request"]
alternative = ["alternative to", "alternatives to", "switched from", "replacement for"]
payment     = ["i'd pay for", "i would pay for", "happy to pay", "willing to pay", "take my money"]
complaint   = ["why doesn't", "why can't", "so frustrating", "drives me crazy", "sucks"]
churn       = ["cancelled my subscription", "canceled my subscription", "stopped using", "moving away from"]
distribution = ["googled", "searched everywhere", "is there a plugin for", "is there an extension for", "is there an app for", "chrome extension", "shopify app", "wordpress plugin", "vs code extension", "figma plugin", "notion template", "zapier integration"]

[pain.phrases.pt]
request     = ["tem algum app que", "tem alguma ferramenta", "alguém conhece um app", "queria um app que", "existe algum app"]
alternative = ["alguém conhece uma alternativa", "alternativa ao", "alternativa para", "troquei o"]
payment     = ["pagaria por", "eu pagaria", "pagaria fácil"]
complaint   = ["por que não tem", "que raiva do", "não aguento mais o"]
churn       = ["cancelei minha assinatura", "cancelei a assinatura", "parei de usar"]
distribution = ["procurei no google", "pesquisei e não achei", "tem alguma extensão", "tem algum plugin", "extensão do chrome", "app da shopify", "plugin do wordpress"]

[pain.phrases.es]
request     = ["hay alguna app", "hay alguna herramienta", "alguien conoce una app", "ojalá existiera"]
alternative = ["alternativa a", "alguien conoce una alternativa", "me cambié de"]
payment     = ["pagaría por", "yo pagaría"]
complaint   = ["por qué no tiene", "qué frustrante"]
churn       = ["cancelé mi suscripción", "dejé de usar"]
distribution = ["busqué en google", "busqué por todas partes", "hay alguna extensión", "hay algún plugin", "extensión de chrome", "app de shopify", "plugin de wordpress"]

[pain.phrases.de]
request     = ["gibt es eine app", "gibt es ein tool", "ich wünschte es gäbe"]
alternative = ["alternative zu"]
payment     = ["würde dafür zahlen", "würde dafür bezahlen"]
complaint   = ["warum kann", "nervt"]
churn       = ["abo gekündigt", "nutze ich nicht mehr"]
distribution = ["gibt es ein plugin", "gibt es eine erweiterung", "chrome-erweiterung"]

[pain.phrases.fr]
request     = ["existe-t-il une app", "il existe une appli", "je cherche un outil"]
alternative = ["alternative à"]
payment     = ["je paierais pour", "prêt à payer"]
complaint   = ["pourquoi ne peut", "tellement frustrant"]
churn       = ["résilié mon abonnement", "j'ai arrêté d'utiliser"]
distribution = ["existe-t-il un plugin", "existe-t-il une extension", "extension chrome"]

# Trechos que anulam as frases que caem dentro deles (falsos positivos).
# Ex.: "willing to pay" em "above what you are willing to pay" é preço, não dor.
[pain.exclude]
en = [
  "what you are willing to pay", "what you're willing to pay", "what they are willing to pay",
  "what people are willing to pay", "willing to pay the price", "sucks up", "sucks in",
  "that sucks", "it sucks", "this sucks", "life sucks", "alternative to the", "an alternative to it",
]
pt = ["alternativa para isso", "alternativa para o problema"]
es = ["alternativa a esto", "alternativa a eso"]

# ---------------------------------------------------------------------------
# Marcas
# ---------------------------------------------------------------------------
# Lista inicial de marcas reconhecidas no texto (sem diferenciar maiúsculas).
# Os padrões abaixo e o owner/repo do GitHub completam a lista sozinhos.
[brands]
seed = [
  "Notion", "Trello", "Asana", "Jira", "Slack", "Zapier", "Airtable",
  "Harvest", "Toggl", "FreshBooks", "QuickBooks", "Xero", "Stripe", "Gumroad",
  "Calendly", "Mailchimp", "HubSpot", "Shopify", "WordPress", "Figma",
  "Canva", "Evernote", "Todoist", "Obsidian", "Dropbox", "Google Drive",
]

# Padrões com {marca}: a palavra (ou duas) no lugar de {marca} vira marca se
# parecer nome próprio (começa com maiúscula, ex.: "Notion", "iCloud") ou se
# estiver na lista-semente. Artigos logo depois do padrão são pulados.
[brands.patterns]
en = [
  "alternative to {marca}", "alternatives to {marca}", "switched from {marca}",
  "replacement for {marca}", "moving away from {marca}", "migrated from {marca}",
  "{marca} sucks", "{marca} is terrible", "{marca} is too expensive", "cancelled my {marca}",
]
pt = [
  "alternativa ao {marca}", "alternativa à {marca}", "alternativa para o {marca}",
  "alternativa para {marca}", "troquei o {marca}", "saí do {marca}", "cancelei o {marca}",
  "{marca} é muito caro", "{marca} é horrível",
]
es = [
  "alternativa a {marca}", "alternativa al {marca}", "me cambié de {marca}",
  "dejé {marca}", "{marca} es muy caro", "{marca} es horrible",
]

# ---------------------------------------------------------------------------
# Palavras-chave (daily_terms)
# ---------------------------------------------------------------------------
# 1 a 3-gramas sem stopwords, contados uma vez por item, de todos os itens
# coletados (candidatos ou não). Palavras das próprias frases de dor sozinhas
# ("alternative", "pay") não contam: aparecem em tudo por construção.
[keywords]
max_n = 3
# Limita itens longos (issues do GitHub) a dominar a contagem.
max_per_item = 40
# Numa execução, termos com menos ocorrências que isso (por dia, fonte, idioma
# e país) não são gravados. É o que mantém o banco pequeno; suba se crescer demais.
min_count = 3

# ---------------------------------------------------------------------------
# Coleta (design, seção 5.1)
# ---------------------------------------------------------------------------
[collect]
# Sem cursor (primeira execução ou cursor apagado), busca os últimos N dias.
# Com cursor, busca tudo desde a última coleta bem-sucedida, por maior que
# seja o intervalo (celular desligado, processo morto pelo Android etc.).
initial_lookback_days = 7
# Re-busca os últimos N minutos da janela anterior, para pegar posts que a
# fonte indexou com atraso. Os repetidos são descartados.
overlap_minutes = 60
# Fontes coletadas por "collect --source all" e vigiadas pelo "check". Tire
# daqui uma fonte que você não usa (ex.: sem credenciais do Bluesky), senão
# ela gera um alerta de falha por dia.
sources = ["hn", "bsky", "gh"]

# ---------------------------------------------------------------------------
# Armazenamento (meta do design: banco < 200 MB/ano)
# ---------------------------------------------------------------------------
# Aplicado depois de cada coleta, inclusive ao que já está no banco.
[storage]
# Candidatos com texto guardado, por fonte e por dia (os de maior pain_score).
# A IA usa no máximo ai.max_items por semana; os demais candidatos continuam
# contados nas agregações (taxa de candidatos, relatório), só sem o texto.
max_candidates_per_day = 100
# Caracteres de texto guardados por candidato (a IA usa ai.item_chars).
max_text_chars = 1200
# Semanas de contagens diárias de termos e marcas mantidas (a tendência usa 5).
keep_term_weeks = 8

# ---------------------------------------------------------------------------
# Alertas pelo Telegram ("ideias check", design 5.7)
# ---------------------------------------------------------------------------
[alerts]
# Alerta se a fonte falhou em todas as execuções dos N últimos dias com execução.
failing_days = 2
# Alerta se nenhuma fonte coletou com sucesso há mais que isso.
stale_hours = 48
# Enquanto o problema continuar, o mesmo alerta só se repete depois disso.
repeat_hours = 24

# ---------------------------------------------------------------------------
# Backup (design 5.6): depois de cada relatório e com "ideias backup"
# ---------------------------------------------------------------------------
[backup]
# Pasta compartilhada do Android (sobrevive a reinstalar o Termux; precisa de
# termux-setup-storage). Deixe vazio para desligar o backup automático.
dir = "~/storage/shared/ideias-backup"
keep = 4

[sources.hn]
# Idiomas cujas frases de dor são buscadas no Hacker News. Lá quase tudo é em
# inglês; cada frase custa ao menos uma requisição por coleta.
languages = ["en"]

[sources.bsky]
# Cada frase é buscada com o filtro de idioma do próprio Bluesky (lang=).
# Precisa de BSKY_HANDLE e BSKY_APP_PASSWORD no env.
languages = ["en", "pt", "es", "de", "fr"]

[sources.gh]
# Issues do GitHub são quase todas em inglês. Precisa de GITHUB_TOKEN no env.
languages = ["en"]
# A issue precisa ter pelo menos uma destas labels (vazio = qualquer issue).
labels = ["enhancement", "feature request", "feature-request", "feature"]

# ---------------------------------------------------------------------------
# Rubrica de viabilidade (design, seção 6)
# ---------------------------------------------------------------------------
# Pesos em %, a soma precisa dar 100. Cada critério recebe nota de 0 a 5 da IA.
[rubric]
frequency    = 10  # frequência e tendência da dor
payment      = 20  # sinal de pagamento
distribution = 15  # distribuição automática (SEO, marketplace, conteúdo, crescimento embutido)
b2b          = 10  # público B2B ou prosumer
global       = 10  # global e em USD
solo         = 15  # construível solo
sellability  = 10  # vendabilidade
infra        = 10  # infraestrutura barata

# ---------------------------------------------------------------------------
# IA via OmniRoute (design, seção 5.5)
# ---------------------------------------------------------------------------
# O OmniRoute é infraestrutura externa: o "ideias" só consome a API dele.
# A URL e a chave vêm do ambiente (OMNIROUTE_BASE_URL, OMNIROUTE_API_KEY).
[ai]
# Nome do modelo ou combo configurado no OmniRoute para cada etapa.
group_model = "combo-agrupar"
score_model = "combo-pontuar"
# Limite de tokens (entrada + saída) por semana ISO, para preservar as cotas
# gratuitas. Antes de cada chamada, o custo é estimado; se for estourar, o
# relatório sai sem IA e o pacote do modo manual (Claude web) é gerado.
weekly_token_limit = 500000
# Candidatos enviados por semana (os de maior pain_score) e por chamada.
max_items = 400
batch_size = 50
# Caracteres de texto de cada candidato enviados à IA.
item_chars = 500
# Clusters existentes mostrados à IA para reaproveitar (os vistos mais recentemente).
max_clusters = 150
# Quantas dores são pontuadas por semana (as mais citadas na semana).
score_top = 20
# Ajustes da nota final (0 a 100): cada penalidade da rubrica tira
# penalty_points; o bônus de concorrência soma bonus_points.
penalty_points = 15
bonus_points = 5
# Tempo máximo de cada chamada, em segundos (modelos gratuitos podem ser lentos).
timeout_seconds = 300
# Modo manual: o candidatos.md é dividido em partes deste tamanho (caracteres)
# para anexar no claude.ai sem estourar o limite de anexo.
manual_part_chars = 120000

# ---------------------------------------------------------------------------
# Relatório semanal (design, seção 7)
# ---------------------------------------------------------------------------
[report]
# Pasta dos relatórios AAAA-WW.md, relativa à pasta onde o comando roda
# ("~" é expandido). O F7 lê os relatórios de reports/ no repositório.
dir = "reports"
# Pasta dos pacotes do modo manual (Claude web): export/AAAA-WW/prompt.md e candidatos.md.
export_dir = "export"
# Tamanho das listas: o relatório deve ser lido em poucos minutos.
top_candidates = 10
top_keywords = 15
top_brands = 15
# Termos com menos ocorrências na semana não entram em "palavras-chave em alta".
min_keyword_count = 3
